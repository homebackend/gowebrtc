name: Build and Release CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'debian.control'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install GStreamer Dependencies (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            pkg-config

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Executable Binary
        run: make build

      - name: Build Debian Package
        run: make debian

      - name: Extract Release Version
        id: extract_version
        run: |
          # Extract version from debian.control (ignoring spaces around the colon)
          VERSION=$(grep -i '^Version:' debian.control | awk '{print $2}')
          echo "Extracted Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and Upload Release Assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}
          name: Release v${{ steps.extract_version.outputs.version }}
          body: |
            Automated production release for version ${{ steps.extract_version.outputs.version }}.
            
          draft: false
          prerelease: false
          files: |
            bin/gowebrtc
            build/debian/gowebrtc.deb
